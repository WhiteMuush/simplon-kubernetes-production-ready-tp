image:
  repository: microservices
  tag: ""
  pullPolicy: IfNotPresent

containerPort: 8080

# Fallback pour tout service sans bloc "resources" (voir deployment.yaml).
# Valeurs modestes : les services Go consomment ~30Mo au repos. A recalibrer via kubectl top.
defaultResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

services:
  api:
    command: ["./api"]
    replicaCount: 3
    service:
      type: LoadBalancer
      port: 8080
    env:
      BOOKS_API_HOST: books
      MOVIES_API_HOST: movies

  books:
    command: ["./books"]
    replicaCount: 3
    service:
      type: ClusterIP
      port: 80

  movies:
    command: ["./movies"]
    replicaCount: 3
    service:
      type: ClusterIP
      port: 80

limitRange:
  enabled: true
  name: microservices-limits
  limits:
    - type: Container
      default:          # limit injectee si le conteneur n'en declare pas
        cpu: 200m
        memory: 128Mi
      defaultRequest:   # request injectee si le conteneur n'en declare pas
        cpu: 50m
        memory: 64Mi
      max:              # request/limit au-dessus = pod refuse
        cpu: "1"
        memory: 512Mi
      min:
        cpu: 10m
        memory: 32Mi

# Plafond global du namespace. Refuse la CREATION si la somme depasse (ne tue rien au runtime).
# Budget cale pour laisser tourner les 9 conteneurs avec de la marge.
resourceQuota:
  enabled: true
  name: microservices-quota
  hard:
    # Declarer requests.cpu ici oblige chaque conteneur a declarer sa request
    # (couvert par defaultResources + le LimitRange).
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "3"
    limits.memory: 2Gi
    pods: "12"        # 9 en regime normal + surplus rolling update (maxSurge 25% x3 Deployments)
