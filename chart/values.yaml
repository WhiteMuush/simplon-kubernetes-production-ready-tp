image:
  repository: microservices
  tag: ""
  pullPolicy: IfNotPresent

containerPort: 8080

defaultResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

services:
  api:
    command: ["./api"]
    replicaCount: 3
    service:
      type: LoadBalancer
      port: 8080
    env:
      BOOKS_API_HOST: books
      MOVIES_API_HOST: movies

  books:
    command: ["./books"]
    replicaCount: 3
    service:
      type: ClusterIP
      port: 80

  movies:
    command: ["./movies"]
    replicaCount: 3
    service:
      type: ClusterIP
      port: 80

limitRange:
  enabled: true
  name: microservices-limits
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 128Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: "1"
        memory: 512Mi

resourceQuota:
  enabled: true
  name: microservices-quota
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "12"
